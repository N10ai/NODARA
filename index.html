<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NODARA</title><style>:root{--bg:#07090d;--line:#202735;--text:#f6f8fb;--muted:#8791a1;--blue:#3b82f6;--blue2:#60a5fa;--good:#62d7a7;--warn:#f2b45b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% 0,#0d2448 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid var(--line);padding:27px 17px}.brand{font-weight:800;letter-spacing:.18em;margin:0 10px 38px}.brand i,.eyebrow{color:var(--blue2)}.nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:12px 14px;text-align:left;border-radius:12px;font-size:14px;margin:2px}.nav button.active{background:#121824;color:#fff}.main{padding:38px 44px 100px;max-width:900px;width:100%;margin:auto}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.15em;text-transform:uppercase}.title{font-size:46px;letter-spacing:-.05em;margin:9px 0}.muted{color:var(--muted)}button{cursor:pointer}.primary,.secondary,.choice{border-radius:14px;padding:16px 18px;font-size:15px;color:#fff}.primary{background:linear-gradient(135deg,var(--blue),#2563eb);border:1px solid #609bfa;font-weight:750}.secondary,.choice{background:#131923;border:1px solid #273142}.card{background:linear-gradient(180deg,#111720,#0c1016);border:1px solid var(--line);border-radius:21px;padding:24px;margin-top:26px}.top,.status{display:flex;justify-content:space-between;align-items:center}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1}.steps{display:flex;gap:7px;margin:25px 0}.steps span{height:3px;flex:1;background:#242c39;border-radius:4px}.steps span.on{background:var(--blue)}.record{padding:18px;background:#0b1017;border:1px solid #222b39;border-radius:15px;margin-top:16px;line-height:1.7}.record strong{font-size:18px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{font-size:12px;padding:7px 9px;border-radius:999px;background:#151b25;border:1px solid #2b3545}.status{padding:13px 0;border-bottom:1px solid #1f2733}.status:last-child{border:0}.ok{color:var(--good)}.warning{color:var(--warn)}.scanbox{padding:30px;border:1px dashed #33415a;border-radius:18px;text-align:center;background:#0c1118}.scanmark{width:52px;height:52px;border:2px solid var(--blue2);border-radius:14px;margin:0 auto 14px}.big{font-size:30px;font-weight:780}.counter{display:flex;align-items:center;justify-content:center;gap:20px;margin:22px}.counter button{width:48px;height:48px;border-radius:50%;background:#151c27;border:1px solid #2b3648;color:#fff;font-size:24px}.counter b{font-size:44px}.sop{border-left:3px solid var(--blue);padding-left:16px;margin:18px 0}.sop div{margin:7px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#131923;padding:15px;border-radius:14px}.mini span{display:block;color:var(--muted);font-size:12px}.mini b{font-size:24px}.choice{width:100%;text-align:left;margin-top:9px}.choice small{display:block;color:var(--muted);margin-top:4px}.field{margin-top:13px}.field label{display:block;color:#9ba5b5;font-size:12px;margin-bottom:7px}.field input{width:100%;background:#0b1017;border:1px solid #293345;color:#fff;border-radius:12px;padding:14px}.subtle{background:transparent;border:0;color:#8791a1;padding:10px}.gate{border-left:3px solid var(--warn);padding-left:16px;margin:18px 0}.check{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #1f2733}.check:last-child{border:0}@media(max-width:760px){.app{display:block}.side{display:none}.main{padding:27px 18px 90px}.title{font-size:36px}.summary{grid-template-columns:1fr}.actions{position:sticky;bottom:10px;background:#07090de8;padding-top:8px}}</style></head><body><div class="app"><aside class="side"><div class="brand">NODARA<i>°</i></div><nav class="nav"><button onclick="home()">Command</button><button>Jobs</button><button onclick="warehouse()">Warehouse</button><button onclick="inventory()">Inventory</button><button>Move</button><button>Pricing</button><button>Finance</button><button>Entities</button></nav></aside><main class="main" id="main"></main></div><script>const M=document.getElementById('main');let step=0,count=5,damaged=false,method='cartons',releaseQty=18;const receiveSteps=['Identify','Confirm','Count','Verify','Done'];function progress(labels,i){return `<div class="steps">${labels.map((_,x)=>`<span class="${x<=i?'on':''}"></span>`).join('')}</div>`}function shell(eye,t,b,p=''){M.innerHTML=`<div class="eyebrow">${eye}</div>${p}<h1 class="title">${t}</h1>${b}`}function home(){shell('Command','Good morning.',`<div class="top"><div class="muted">NODARA handles the paperwork. You handle the cargo.</div><div><button class="primary" onclick="start()">Receive</button> <button class="secondary" onclick="releaseStart()">Release</button></div></div><div class="card"><div class="eyebrow">Next best actions</div><h2>5 pallets expected from ABC Trucking</h2><p class="muted">ACME Logistics · PO 458291 · Storage</p><button class="primary" onclick="start()">Start receiving</button></div><div class="card"><h2>Release 18 EA of ABC-123</h2><p class="muted">ACME Logistics · inventory available · allocation ready</p><button class="secondary" onclick="releaseStart()">Start cargo release</button></div>`)}function warehouse(){home()}function inventory(){shell('Inventory','Inventory.',`<div class="card"><div class="record"><strong>ABC-123 · Brake component</strong><div class="summary"><div class="mini"><span>Available</span><b>300 EA</b></div><div class="mini"><span>Boxes</span><b>25</b></div><div class="mini"><span>Pallets</span><b>5</b></div></div><div class="status"><span>Locations</span><b>A-04-02 · A-04-03</b></div></div><button class="primary" style="width:100%;margin-top:14px" onclick="releaseStart()">Create cargo release</button></div>`)}function start(){step=0;shell('Warehouse · Guided Receive','What arrived?',`<p class="muted">Scan anything you have. NODARA will find the record and rules.</p><div class="card"><div class="scanbox"><div class="scanmark"></div><div class="big">Scan label or document</div><p class="muted">QR · barcode · BOL · packing list · PO · PRO · tracking</p><button class="primary" onclick="found()">Scan</button></div><button class="secondary" style="width:100%;margin-top:12px" onclick="found()">Search instead</button></div>`,progress(receiveSteps,step))}function found(){step=1;shell('Warehouse · Guided Receive','Found it.',`<p class="muted">Expected receipt and warehouse instructions matched automatically.</p><div class="card"><div class="record"><strong>ACME Logistics</strong><br>ABC Manufacturing → XYZ Imports<br>Automotive replacement parts<div class="chips"><span class="chip">PO 458291</span><span class="chip">BOL MIA392810</span><span class="chip">PRO 73829103</span></div></div><div class="record"><div class="status"><span>Expected</span><b>5 pallets</b></div><div class="status"><span>Carrier</span><b>ABC Trucking</b></div><div class="status"><span>Service</span><b>Storage</b></div><div class="status"><span>Time in</span><b class="ok">Now · automatic</b></div></div><div class="sop"><div><b>NODARA already knows:</b></div><div>Receive by carton · 4 photos · dimensions per pallet · UIN labels · putaway required</div></div><div class="actions"><button class="secondary" onclick="countStep()">Something changed</button><button class="primary" onclick="countStep()">Looks right</button></div></div>`,progress(receiveSteps,step))}function countStep(){step=2;shell('Warehouse · Guided Receive','How many pallets are here?',`<p class="muted">Expected 5</p><div class="card" style="text-align:center"><div class="counter"><button onclick="count=Math.max(0,count-1);countStep()">−</button><b>${count}</b><button onclick="count++;countStep()">+</button></div>${count===5?'<p class="ok">Matches expected</p>':'<p class="warning">Difference will be recorded automatically</p>'}<div class="actions"><button class="secondary" onclick="found()">Back</button><button class="primary" onclick="verify()">Start pallet 1</button></div></div>`,progress(receiveSteps,step))}function verify(){step=3;shell('Warehouse · Guided Receive','Pallet 1 of '+count,`<p class="muted">Only verify the required physical facts.</p><div class="card"><div class="summary"><div class="mini"><span>Detected</span><b>5 CTN</b></div><div class="mini"><span>Contained</span><b>60 EA</b></div><div class="mini"><span>Weight</span><b>742 lb</b></div></div><div class="record">48 × 40 × 62 IN<br>ABC-123 · 5 CTN × 12 EA</div><div class="status"><span>Photos</span><b class="ok">4 / 4</b></div><div class="status"><span>Dimensions</span><b class="ok">Captured</b></div><div class="status"><span>Condition</span><b>${damaged?'<span class="warning">Damaged</span>':'Good'}</b></div><div class="actions"><button class="secondary" onclick="damaged=!damaged;verify()">${damaged?'Clear damage':'Report damage'}</button><button class="primary" onclick="finish()">${damaged?'Continue with exception':'Looks good'}</button></div></div>`,progress(receiveSteps,step))}function finish(){step=4;shell('Warehouse · Guided Receive','Receipt complete.',`<p class="ok">WR-260901-0042 · custody received</p><div class="card"><div class="record"><strong>ACME Logistics</strong><br>${count} PLT · ${count*5} CTN · ${count*60} EA<div class="chips"><span class="chip">Inventory created</span><span class="chip">Labels ready</span></div></div><div class="status"><span>Next</span><b>Putaway</b></div><button class="primary" style="width:100%;margin-top:16px">Print labels</button><button class="secondary" style="width:100%;margin-top:10px">Start guided putaway</button><button class="subtle" style="width:100%" onclick="home()">Done</button></div>`,progress(receiveSteps,step))}
function releaseStart(){shell('Warehouse · Cargo Release','What should leave?',`<p class="muted">Search by part, SKU, UIN, lot, serial, PO, WR or customer.</p><div class="card"><div class="field"><label>Request</label><input value="ABC-123 · 18 EA"></div><button class="primary" style="width:100%;margin-top:14px" onclick="releaseFound()">Find inventory</button></div>`)}function releaseFound(){shell('Warehouse · Cargo Release','Inventory found.',`<div class="card"><div class="record"><strong>ABC-123</strong><br>300 EA available · 25 boxes · 5 pallets<div class="chips"><span class="chip">FIFO</span><span class="chip">Full package first</span></div></div><div class="status"><span>Requested</span><b>${releaseQty} EA</b></div><div class="status"><span>NODARA recommends</span><b>1 full box + 6 EA</b></div><div class="record">Pick CTN-26-000921 · 12 EA<br>Open CTN-26-000922 · pick 6 of 12 EA</div><div class="actions"><button class="secondary" onclick="releaseCustom()">Change allocation</button><button class="primary" onclick="releasePick()">Accept & pick</button></div></div>`)}function releaseCustom(){shell('Warehouse · Cargo Release','Release another layer?',`<p class="muted">Use only when the request specifies a physical unit, lot or serial.</p><div class="card"><button class="choice" onclick="releasePick()"><b>Specific pallet / carton</b><small>Scan a UIN</small></button><button class="choice" onclick="releasePick()"><b>Specific lot</b><small>Restrict allocation to one lot</small></button><button class="choice" onclick="releasePick()"><b>Specific serial</b><small>Release exact serialized unit</small></button><button class="subtle" onclick="releaseFound()">Back</button></div>`)}function releasePick(){shell('Warehouse · Cargo Release','Go to A-04-02.',`<p class="muted">One instruction at a time.</p><div class="card"><div class="record"><strong>Scan CTN-26-000921</strong><br>Pick complete box · 12 EA</div><button class="primary" style="width:100%;margin-top:14px" onclick="releasePick2()">Scan box</button></div>`)}function releasePick2(){shell('Warehouse · Cargo Release','Pick 6 more.',`<div class="card"><div class="record"><strong>CTN-26-000922</strong><br>Open box · pick 6 of 12 EA<br><span class="muted">6 EA will remain in this carton</span></div><button class="primary" style="width:100%;margin-top:14px" onclick="releaseStage()">Confirm 6 picked</button></div>`)}function releaseStage(){shell('Warehouse · Cargo Release','18 of 18 picked.',`<div class="card"><div class="status"><span>Picked</span><b class="ok">18 EA</b></div><div class="status"><span>Stage at</span><b>OUT-02</b></div><button class="primary" style="width:100%;margin-top:14px" onclick="releaseCustody()">Stage & continue</button></div>`)}function releaseCustody(){shell('Warehouse · Cargo Release','Who is taking custody?',`<p class="muted">NODARA blocks release until required transfer controls are satisfied.</p><div class="card"><div class="record"><strong>XYZ Transport</strong><br>Driver: Mike Perez · Trailer T-0922<br>PRO 88129384 · Time in automatic</div><div class="gate"><div class="check"><span>Driver / recipient ID</span><b class="ok">Verified</b></div><div class="check"><span>Cargo Release authorization</span><b class="ok">Verified</b></div><div class="check"><span>BOL / custody document</span><b class="ok">Signed</b></div><div class="check"><span>Cargo count / identity</span><b class="ok">Verified</b></div><div class="check"><span>Bonded carrier</span><b class="ok">Verified</b></div><div class="check"><span>STA / TSA</span><b class="ok">Verified</b></div></div><button class="primary" style="width:100%;margin-top:16px" onclick="releaseComplete()">Transfer custody</button></div>`)}function releaseComplete(){shell('Warehouse · Cargo Release','Cargo released.',`<p class="ok">CR-260901-0018 · custody transferred</p><div class="card"><div class="record"><strong>18 EA · ABC-123</strong><br>Warehouse → XYZ Transport<br>Mike Perez · identity verified<br>Signed BOL and release preserved</div><div class="status"><span>Time out</span><b class="ok">Recorded automatically</b></div><div class="status"><span>Inventory remaining</span><b>282 EA</b></div><div class="status"><span>Partial carton</span><b>6 EA remaining</b></div><button class="subtle" style="width:100%;margin-top:12px" onclick="home()">Done</button></div>`)}home();</script></body></html>
