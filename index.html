<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NODARA</title><style>:root{--bg:#07090d;--panel:#0f131a;--line:#202735;--text:#f6f8fb;--muted:#858e9e;--blue:#3b82f6;--blue2:#60a5fa;--good:#5bd3a0;--warn:#f4b860}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#0c2345 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{border-right:1px solid var(--line);padding:26px 18px}.brand{font-weight:800;letter-spacing:.18em;margin:0 10px 38px}.brand i,.eyebrow{color:var(--blue2)}.nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:12px 14px;text-align:left;border-radius:12px;font-size:14px;margin:2px 0}.nav button:first-child{background:#121824;color:#fff}.main{padding:36px 44px 100px;max-width:1150px;width:100%;margin:auto}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.title{font-size:42px;letter-spacing:-.045em;margin:8px 0}.muted{color:var(--muted)}.primary,.secondary,.option,.flag{border-radius:13px;padding:15px 17px;font-size:14px;color:#fff}.primary{background:linear-gradient(135deg,var(--blue),#2563eb);border:1px solid #5a97f7;font-weight:700}.secondary,.option,.flag{background:#131923;border:1px solid #273142}.card{background:linear-gradient(180deg,#111720,#0c1016);border:1px solid var(--line);border-radius:19px;padding:22px;margin-top:24px}.top{display:flex;justify-content:space-between;align-items:start}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{margin-top:14px}.field label{display:block;color:#9ba5b5;font-size:12px;margin-bottom:7px}.field input{width:100%;background:#0b1017;border:1px solid #293345;color:#fff;border-radius:12px;padding:14px;font-size:15px}.options,.flags{display:grid;gap:10px;margin-top:20px}.flags{grid-template-columns:repeat(3,1fr)}.option{text-align:left;display:flex;gap:14px;align-items:center}.option strong{display:block}.option small{display:block;color:var(--muted);margin-top:4px}.option.selected,.flag.selected{border-color:#4f8ff5;background:#12213a}.flag{padding:11px 12px}.dot{width:17px;height:17px;border:2px solid #657188;border-radius:50%}.selected .dot{border:5px solid var(--blue2)}.steps{display:flex;gap:7px;margin:25px 0}.steps span{height:3px;flex:1;background:#242c39;border-radius:4px}.steps span.on{background:var(--blue)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#131923;padding:15px;border-radius:13px}.mini b{display:block;font-size:24px}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1}.tree,.checklist{padding:14px;background:#0b1017;border:1px solid #222b39;border-radius:13px;margin-top:15px;line-height:1.9}.check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1d2531}.check:last-child{border-bottom:0}.done{color:var(--good)}.warning{color:var(--warn)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{font-size:12px;padding:7px 9px;border-radius:999px;background:#151b25;border:1px solid #2b3545}@media(max-width:760px){.app{display:block}.side{display:none}.main{padding:26px 18px 90px}.title{font-size:34px}.row,.summary,.flags{grid-template-columns:1fr}.top{align-items:center}}</style></head><body><div class="app"><aside class="side"><div class="brand">NODARA<i>°</i></div><nav class="nav"><button onclick="home()">Command</button><button>Jobs</button><button>Warehouse</button><button>Inventory</button><button>Move</button><button>Pricing</button><button>Finance</button><button>Entities</button></nav></aside><main class="main" id="main"></main></div><script>
let step=0,depth='units',flags=['DAMAGED'];const M=document.getElementById('main');const labels=['Identify','Info','Custody','Tracking','Cargo','Inspect','Review','Complete'];function progress(){return `<div class="steps">${labels.map((_,i)=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div>`}function shell(title,body){M.innerHTML=`<div class="eyebrow">Warehouse · Receive</div>${progress()}<h1 class="title">${title}</h1>${body}`}function home(){step=0;M.innerHTML=`<div class="top"><div><div class="eyebrow">Command</div><h1 class="title">Good morning.</h1><div class="muted">Here’s what needs attention.</div></div><button class="primary" onclick="receive()">＋ Receive</button></div><div class="card"><div class="eyebrow">Next best action</div><h2>Receive expected cargo</h2><p class="muted">Start a guided warehouse receipt with cargo, custody and compliance controls.</p><button class="primary" onclick="receive()">Start receiving</button></div>`}
function receive(){step=0;shell('Identify the cargo.',`<p class="muted">Scan first. Search or manual entry only when needed.</p><div class="card"><button class="primary" style="width:100%" onclick="info()">Scan barcode / QR</button><button class="secondary" style="width:100%;margin-top:10px" onclick="info()">Scan document with OCR</button><div class="field"><label>Customer / PO / reference</label><input value="ACME · PO 458291"></div><button class="secondary" style="width:100%;margin-top:10px" onclick="info()">Continue manually</button></div>`)}
function info(){step=1;shell('What are we receiving?',`<p class="muted">Operational identity for the warehouse. No forwarding-only fields.</p><div class="card"><div class="row"><div class="field"><label>Customer</label><input value="ACME Logistics"></div><div class="field"><label>Shipper</label><input value="ABC Manufacturing"></div><div class="field"><label>Consignee</label><input value="XYZ Imports"></div><div class="field"><label>Description</label><input value="Automotive replacement parts"></div><div class="field"><label>Commodity</label><input value="Brake components"></div><div class="field"><label>Special instructions</label><input value="Keep dry · Do not stack"></div></div><div style="margin-top:18px"><strong>References</strong><div class="chips"><span class="chip">PO · 458291</span><span class="chip">BOL · MIA392810</span><span class="chip">PRO · 73829103</span><span class="chip">Entry · 123-4567890-1</span></div></div><div style="margin-top:18px"><strong>Flags</strong><div class="flags">${['DAMAGED','DG','HIGH_VALUE','DO_NOT_STACK','CUSTOMS_HOLD','STA_REQUIRED','BONDED','FTZ','TSA_CONTROLLED'].map(f=>`<button class="flag ${flags.includes(f)?'selected':''}" onclick="toggleFlag('${f}')">${f.replaceAll('_',' ')}</button>`).join('')}</div></div><div class="actions"><button class="secondary" onclick="receive()">Back</button><button class="primary" onclick="custody()">Continue</button></div></div>`)}
function toggleFlag(f){flags=flags.includes(f)?flags.filter(x=>x!==f):[...flags,f];info()}
function custody(){step=2;const controlled=flags.includes('STA_REQUIRED')||flags.includes('TSA_CONTROLLED')||flags.includes('BONDED')||flags.includes('CUSTOMS_HOLD');shell('Who delivered it?',`<p class="muted">Record the physical handoff and chain of custody.</p><div class="card"><div class="row"><div class="field"><label>Carrier / trucking company</label><input value="ABC Trucking"></div><div class="field"><label>Driver</label><input value="John Smith"></div><div class="field"><label>PRO #</label><input value="73829103"></div><div class="field"><label>Tracking #</label><input value="TRK-882911"></div><div class="field"><label>BOL / delivery receipt</label><input value="MIA392810"></div><div class="field"><label>Trailer #</label><input value="5318"></div><div class="field"><label>Dock / door</label><input value="3"></div><div class="field"><label>Time in</label><input value="09:08"></div></div><div class="checklist"><div class="check"><input type="checkbox" checked> Delivery / custody document verified</div><div class="check"><input type="checkbox" checked> Cargo count / identity verified</div>${controlled?`<div class="check"><input type="checkbox"> Driver / recipient ID verified</div>`:''}${flags.includes('STA_REQUIRED')||flags.includes('TSA_CONTROLLED')?`<div class="check"><input type="checkbox"> STA / TSA requirement verified</div>`:''}${flags.includes('BONDED')?`<div class="check"><input type="checkbox"> Bonded carrier verified</div>`:''}${flags.includes('CUSTOMS_HOLD')?`<div class="check"><input type="checkbox"> Customs release verified</div>`:''}${flags.includes('DAMAGED')?`<div class="check"><input type="checkbox" checked> Damage photos / exception recorded</div>`:''}</div><div class="actions"><button class="secondary" onclick="info()">Back</button><button class="primary" onclick="tracking()">Continue receiving</button></div></div>`)}
function tracking(){step=3;shell('How should we track it?',`<p class="muted">Choose the deepest inventory level required for this service.</p><div class="options">${[['handling','Handling unit only','Pallet, crate or loose piece.'],['packages','Packages','Track pallet and cartons.'],['units','Units / SKU','Track packages and contained quantities.'],['serialized','Serialized','Control each unit by serial number.']].map(x=>`<button class="option ${depth===x[0]?'selected':''}" onclick="depth='${x[0]}';tracking()"><span class="dot"></span><span><strong>${x[1]}</strong><small>${x[2]}</small></span></button>`).join('')}</div><div class="actions"><button class="secondary" onclick="custody()">Back</button><button class="primary" onclick="cargo()">Continue</button></div>`)}
function cargo(){step=4;shell('Describe what arrived.',`<p class="muted">Capture the structure once. NODARA expands the hierarchy.</p><div class="card"><div class="row"><div class="field"><label>Pallets</label><input value="1"></div><div class="field"><label>Boxes per pallet</label><input value="5"></div><div class="field"><label>Units per box</label><input value="12"></div><div class="field"><label>Part / SKU</label><input value="ABC-123"></div></div><div class="tree">PALLET 1<br>↳ 5 BOXES<br>&nbsp;&nbsp;↳ 12 EA each · ABC-123<br><b>60 total units</b></div><div class="actions"><button class="secondary" onclick="tracking()">Back</button><button class="primary" onclick="measure()">Continue</button></div></div>`)}
function measure(){step=5;shell('Inspect and verify.',`<p class="muted">Measure and document only what the service and flags require.</p><div class="card"><div class="row"><div class="field"><label>Length (in)</label><input value="48"></div><div class="field"><label>Width (in)</label><input value="40"></div><div class="field"><label>Height (in)</label><input value="62"></div><div class="field"><label>Weight (lb)</label><input value="742"></div></div><div class="field"><label>Condition</label><input value="Damaged corner on carton 2"></div><button class="secondary" style="width:100%;margin-top:12px">Add required photos</button><p class="warning">DAMAGED flag active · exception evidence required</p><div class="actions"><button class="secondary" onclick="cargo()">Back</button><button class="primary" onclick="review()">Review</button></div></div>`)}
function review(){step=6;shell('Ready to receive.',`<p class="muted">Review cargo, custody and compliance before transfer is finalized.</p><div class="card"><div class="summary"><div class="mini"><span class="muted">Pallets</span><b>1</b></div><div class="mini"><span class="muted">Boxes</span><b>5</b></div><div class="mini"><span class="muted">Units</span><b>60</b></div></div><div class="tree">ACME Logistics<br>ABC Manufacturing → XYZ Imports<br>PO 458291 · BOL MIA392810 · PRO 73829103<br>1 PALLET → 5 BOXES → 60 EA · ABC-123<br>48 × 40 × 62 IN · 742 LB<br>Flags: ${flags.join(', ') || 'None'}<br>Carrier: ABC Trucking · Driver: John Smith · Door 3</div><div class="checklist"><div class="check"><input type="checkbox" checked> Delivery document verified</div><div class="check"><input type="checkbox" checked> Cargo / quantity verified</div><div class="check"><input type="checkbox" checked> Damage exception documented</div><div class="check"><input type="checkbox" checked> Custody transfer ready</div></div><div class="actions"><button class="secondary" onclick="measure()">Back</button><button class="primary" onclick="complete()">Confirm receipt</button></div></div>`)}
function complete(){step=7;shell('Receipt complete.',`<p class="done">WR-260901-0042 created · custody received</p><div class="card"><div class="summary"><div class="mini"><span class="muted">UINs</span><b>6</b></div><div class="mini"><span class="muted">Labels</span><b>6</b></div><div class="mini"><span class="muted">Next</span><b style="font-size:18px">Putaway</b></div></div><div class="tree">Custody: ABC Trucking → Warehouse · 09:41<br>PLT-26-000184<br>↳ CTN-26-000921 … CTN-26-000925<br>Inventory: 60 EA · ABC-123<br>Exception: DAMAGED · evidence attached</div><button class="primary" style="width:100%;margin-top:18px">Print labels</button><button class="secondary" style="width:100%;margin-top:10px">Scan putaway location</button><button class="secondary" style="width:100%;margin-top:10px" onclick="home()">Done</button></div>`)}home();</script></body></html>
