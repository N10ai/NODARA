<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NODARA — Logistics, orchestrated.</title>
<style>:root{--bg:#07090d;--panel:#0f131a;--line:#202735;--text:#f6f8fb;--muted:#858e9e;--accent:#3b82f6;--accent2:#60a5fa;--good:#5bd3a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#0c2345 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh;background:#090c11aa}.brand{font-weight:800;letter-spacing:.18em;margin:0 10px 38px}.brand i{color:var(--accent2);font-style:normal}.nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:12px 14px;text-align:left;border-radius:12px;font-size:14px;margin:2px 0;display:flex;gap:11px;align-items:center}.nav button.active,.nav button:hover{background:#121824;color:white}.icon{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.main{padding:36px 44px 100px;max-width:1300px;width:100%;margin:auto}.eyebrow{color:var(--accent2);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.top h1{font-size:42px;letter-spacing:-.045em;margin:8px 0}.muted{color:var(--muted)}.primary{background:linear-gradient(135deg,var(--accent),#2563eb);border:1px solid #5a97f7;color:white;font-weight:700;border-radius:13px;padding:13px 18px;font-size:14px;box-shadow:0 10px 35px #2563eb28;display:flex;align-items:center;justify-content:center;gap:8px}.ask{margin:32px 0;background:#0e131bcc;border:1px solid var(--line);border-radius:17px;padding:8px;display:flex;align-items:center;gap:7px}.ask input{flex:1;background:transparent;border:0;outline:0;color:white;font-size:16px;padding:12px}.iconbtn{width:42px;height:42px;background:#151b25;color:#cdd5e2;border:1px solid #293345;border-radius:11px;display:grid;place-items:center}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.card{background:linear-gradient(180deg,#111720,#0c1016);border:1px solid var(--line);border-radius:19px;padding:22px;box-shadow:0 18px 50px #0005}.card h2{margin:0 0 18px;font-size:16px}.action{padding:16px 0;border-top:1px solid #1d2531;display:grid;grid-template-columns:1fr auto;gap:12px}.action:first-of-type{border-top:0}.pill{font-size:11px;border:1px solid #303b4c;border-radius:999px;padding:5px 8px;color:#c7d0de}.number{font-size:38px;font-weight:750;letter-spacing:-.05em}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.mini{padding:14px;border-radius:14px;background:#131923}.mini b{display:block;font-size:22px;margin-bottom:4px}.good{color:var(--good)}.mobilebar{display:none}.choice{width:100%;margin-top:11px;padding:16px;border-radius:13px;background:#131923;border:1px solid #273142;color:white;display:flex;align-items:center;gap:12px;font-size:14px}.choice .icon{color:#aab7c9}
@media(max-width:760px){.app{display:block}.side{display:none}.main{padding:26px 18px 95px}.top h1{font-size:34px}.top{align-items:center}.grid{grid-template-columns:1fr}.metric{grid-template-columns:repeat(3,1fr)}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#090d13ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom));justify-content:space-around}.mobilebar button{background:none;border:0;color:#858e9e;font-size:10px;display:grid;place-items:center;gap:3px}.mobilebar .icon{width:20px;height:20px}.mobilebar .active{color:#fff}}
</style></head><body><div class="app"><aside class="side"><div class="brand">NODARA<i>°</i></div><nav class="nav" id="nav"></nav></aside><main class="main" id="main"></main></div><div class="mobilebar" id="mobile"></div>
<script>
const I={home:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg>',jobs:'<svg class="icon" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 5V3h8v2M8 10h8M8 14h5"/></svg>',warehouse:'<svg class="icon" viewBox="0 0 24 24"><path d="m3 9 9-5 9 5v11H3Z"/><path d="M8 20v-7h8v7M3 9h18"/></svg>',inventory:'<svg class="icon" viewBox="0 0 24 24"><path d="m4 7 8-4 8 4-8 4Z"/><path d="M4 7v10l8 4 8-4V7M12 11v10"/></svg>',move:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 7h11v10H3Z M14 10h4l3 3v4h-7Z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>',pricing:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 3v18M16 7.5c0-2-1.8-3-4-3s-4 1.1-4 3 1.6 2.7 4 3.5 4 1.6 4 3.5-1.8 3-4 3-4-1-4-3"/></svg>',finance:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',entities:'<svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2-6 6-6s6 2 6 6M16 6h5M18.5 3.5v5"/></svg>',plus:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',scan:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M7 9v6M10 8v8M14 8v8M17 9v6"/></svg>',camera:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h4l2-2h4l2 2h4v12H4Z"/><circle cx="12" cy="13" r="4"/></svg>',search:'<svg class="icon" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>',mic:'<svg class="icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>'};
const nav=[['home','Command'],['jobs','Jobs'],['warehouse','Warehouse'],['inventory','Inventory'],['move','Move'],['pricing','Pricing'],['finance','Finance'],['entities','Entities']];document.getElementById('nav').innerHTML=nav.map((x,i)=>`<button class="${i?'':'active'}">${I[x[0]]}${x[1]}</button>`).join('');document.getElementById('mobile').innerHTML=`<button class="active">${I.home}Command</button><button>${I.jobs}Jobs</button><button onclick="receive()">${I.plus}Receive</button><button>${I.inventory}Inventory</button><button>${I.warehouse}Warehouse</button>`;
function command(){document.getElementById('main').innerHTML=`<div class="top"><div><div class="eyebrow">Command</div><h1>Good morning.</h1><div class="muted">Here’s what needs attention.</div></div><button class="primary" onclick="receive()">${I.plus} Receive</button></div><div class="ask"><input placeholder="Ask NODARA or describe what needs to happen…"><button class="iconbtn">${I.search}</button><button class="iconbtn">${I.mic}</button></div><div class="grid"><section class="card"><h2>Next best actions</h2><div class="action"><div><b>Receive expected cargo</b><div class="muted">3 arrivals are ready for warehouse receiving</div></div><span class="pill">Warehouse</span></div><div class="action"><div><b>Resolve receiving discrepancy</b><div class="muted">1 receipt has a quantity exception</div></div><span class="pill">Attention</span></div><div class="action"><div><b>Complete putaway</b><div class="muted">8 handling units are waiting for locations</div></div><span class="pill">Floor</span></div><div class="action"><div><b>Invoice completed jobs</b><div class="muted">4 jobs have unbilled revenue charges</div></div><span class="pill">Finance</span></div></section><section class="card"><h2>Warehouse pulse</h2><div class="number">24</div><div class="muted">active handling units today</div><div class="metric"><div class="mini"><b>3</b><span class="muted">Inbound</span></div><div class="mini"><b>8</b><span class="muted">Putaway</span></div><div class="mini"><b class="good">13</b><span class="muted">Clear</span></div></div></section></div>`}
function receive(){document.getElementById('main').innerHTML=`<div class="eyebrow">Warehouse · Receive</div><h1 style="font-size:42px;letter-spacing:-.045em">Identify the cargo.</h1><p class="muted">Scan a label or document. NODARA will find the expected receipt and guide the rest.</p><div class="card" style="max-width:620px;margin-top:28px"><button class="primary" style="width:100%;font-size:16px;padding:17px">${I.scan} Scan barcode / QR</button><button class="choice">${I.camera}<span>Scan document with OCR</span></button><button class="choice">${I.search}<span>Search expected cargo</span></button><div style="text-align:center;color:#667084;margin:18px">OR USE VOICE</div><div class="ask" style="margin:0"><input placeholder="Receiving for ACME, PO 58492"><button class="iconbtn">${I.mic}</button></div></div>`}command();
</script></body></html>
