<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NODARA</title><style>:root{--bg:#07090d;--line:#202735;--text:#f6f8fb;--muted:#8791a1;--blue:#3b82f6;--blue2:#60a5fa;--good:#62d7a7;--warn:#f2b45b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% 0,#0d2448 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid var(--line);padding:27px 17px}.brand{font-weight:800;letter-spacing:.18em;margin:0 10px 38px}.brand i,.eyebrow{color:var(--blue2)}.nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:12px 14px;text-align:left;border-radius:12px;font-size:14px;margin:2px}.nav button:first-child{background:#121824;color:#fff}.main{padding:38px 44px 100px;max-width:900px;width:100%;margin:auto}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.15em;text-transform:uppercase}.title{font-size:46px;letter-spacing:-.05em;margin:9px 0}.muted{color:var(--muted)}button{cursor:pointer}.primary,.secondary,.choice{border-radius:14px;padding:16px 18px;font-size:15px;color:#fff}.primary{background:linear-gradient(135deg,var(--blue),#2563eb);border:1px solid #609bfa;font-weight:750}.secondary,.choice{background:#131923;border:1px solid #273142}.card{background:linear-gradient(180deg,#111720,#0c1016);border:1px solid var(--line);border-radius:21px;padding:24px;margin-top:26px}.top,.status{display:flex;justify-content:space-between;align-items:center}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1}.steps{display:flex;gap:7px;margin:25px 0}.steps span{height:3px;flex:1;background:#242c39;border-radius:4px}.steps span.on{background:var(--blue)}.record{padding:18px;background:#0b1017;border:1px solid #222b39;border-radius:15px;margin-top:16px;line-height:1.7}.record strong{font-size:18px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{font-size:12px;padding:7px 9px;border-radius:999px;background:#151b25;border:1px solid #2b3545}.status{padding:13px 0;border-bottom:1px solid #1f2733}.status:last-child{border:0}.ok{color:var(--good)}.warning{color:var(--warn)}.scanbox{padding:30px;border:1px dashed #33415a;border-radius:18px;text-align:center;background:#0c1118}.scanmark{width:52px;height:52px;border:2px solid var(--blue2);border-radius:14px;margin:0 auto 14px}.big{font-size:30px;font-weight:780}.counter{display:flex;align-items:center;justify-content:center;gap:20px;margin:22px}.counter button{width:48px;height:48px;border-radius:50%;background:#151c27;border:1px solid #2b3648;color:#fff;font-size:24px}.counter b{font-size:44px}.sop{border-left:3px solid var(--blue);padding-left:16px;margin:18px 0}.sop div{margin:7px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#131923;padding:15px;border-radius:14px}.mini span{display:block;color:var(--muted);font-size:12px}.mini b{font-size:24px}.choice{width:100%;text-align:left;margin-top:9px}.choice small{display:block;color:var(--muted);margin-top:4px}.field{margin-top:13px}.field label{display:block;color:#9ba5b5;font-size:12px;margin-bottom:7px}.field input{width:100%;background:#0b1017;border:1px solid #293345;color:#fff;border-radius:12px;padding:14px}.subtle{background:transparent;border:0;color:#8791a1;padding:10px}@media(max-width:760px){.app{display:block}.side{display:none}.main{padding:27px 18px 90px}.title{font-size:36px}.summary{grid-template-columns:1fr}.actions{position:sticky;bottom:10px;background:#07090de8;padding-top:8px}}</style></head><body><div class="app"><aside class="side"><div class="brand">NODARA<i>°</i></div><nav class="nav"><button onclick="home()">Command</button><button>Jobs</button><button>Warehouse</button><button>Inventory</button><button>Move</button><button>Pricing</button><button>Finance</button><button>Entities</button></nav></aside><main class="main" id="main"></main></div><script>const M=document.getElementById('main');let step=0,count=5,damaged=false,method='cartons';const steps=['Identify','Confirm','Count','Verify','Done'];function progress(){return `<div class="steps">${steps.map((_,i)=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div>`}function shell(t,b){M.innerHTML=`<div class="eyebrow">Warehouse · Guided Receive</div>${progress()}<h1 class="title">${t}</h1>${b}`}function home(){M.innerHTML=`<div class="top"><div><div class="eyebrow">Command</div><h1 class="title">Good morning.</h1><div class="muted">NODARA handles the paperwork. You handle the cargo.</div></div><button class="primary" onclick="start()">Receive</button></div><div class="card"><div class="eyebrow">Next best action</div><h2>5 pallets expected from ABC Trucking</h2><p class="muted">ACME Logistics · PO 458291 · Storage</p><button class="primary" onclick="start()">Start receiving</button></div>`}function start(){step=0;shell('What arrived?',`<p class="muted">Scan anything you have. NODARA will find the record and rules.</p><div class="card"><div class="scanbox"><div class="scanmark"></div><div class="big">Scan label or document</div><p class="muted">QR · barcode · BOL · packing list · PO · PRO · tracking</p><button class="primary" onclick="found()">Scan</button></div><button class="secondary" style="width:100%;margin-top:12px" onclick="found()">Search instead</button></div>`)}function found(){step=1;shell('Found it.',`<p class="muted">Expected receipt and warehouse instructions matched automatically.</p><div class="card"><div class="record"><strong>ACME Logistics</strong><br>ABC Manufacturing → XYZ Imports<br>Automotive replacement parts<div class="chips"><span class="chip">PO 458291</span><span class="chip">BOL MIA392810</span><span class="chip">PRO 73829103</span></div></div><div class="record"><div class="status"><span>Expected</span><b>5 pallets</b></div><div class="status"><span>Carrier</span><b>ABC Trucking</b></div><div class="status"><span>Service</span><b>Storage</b></div><div class="status"><span>Time in</span><b class="ok">Now · automatic</b></div></div><div class="sop"><div><b>NODARA already knows:</b></div><div>Receive by carton · 4 photos · dimensions per pallet · UIN labels · putaway required</div></div><div class="actions"><button class="secondary" onclick="changes()">Something changed</button><button class="primary" onclick="countStep()">Looks right</button></div></div>`)}function changes(){shell('Only change what is different.',`<div class="card"><button class="choice" onclick="editDelivery()"><b>Delivery information</b><small>Carrier, driver, PRO, BOL or reference</small></button><button class="choice" onclick="methodStep()"><b>Receiving method</b><small>Override carton-level tracking for this receipt</small></button><button class="choice" onclick="countStep()"><b>Quantity</b><small>Continue and record actual pallet count</small></button><button class="subtle" onclick="found()">Cancel</button></div>`)}function editDelivery(){shell('Correct delivery information.',`<div class="card"><div class="field"><label>Carrier</label><input value="ABC Trucking"></div><div class="field"><label>Driver</label><input value="John Smith"></div><div class="field"><label>PRO / tracking</label><input value="73829103"></div><div class="actions"><button class="secondary" onclick="changes()">Back</button><button class="primary" onclick="countStep()">Save</button></div></div>`)}function methodStep(){shell('Override receiving method?',`<p class="muted">ACME normally requires carton-level control. Change this receipt only if the physical/service requirement is different.</p><div class="card">${[['handling','Pallet / handling unit only'],['cartons','Cartons + contained units'],['units','Individual units / SKU'],['serialized','Serialized units']].map(x=>`<button class="choice" onclick="method='${x[0]}';countStep()"><b>${method===x[0]?'✓ ':''}${x[1]}</b></button>`).join('')}<button class="subtle" onclick="changes()">Cancel</button></div>`)}function countStep(){step=2;shell('How many pallets are here?',`<p class="muted">Expected 5 · tracking rule: ${method}</p><div class="card" style="text-align:center"><div class="counter"><button onclick="count=Math.max(0,count-1);countStep()">−</button><b>${count}</b><button onclick="count++;countStep()">+</button></div>${count===5?'<p class="ok">Matches expected</p>':'<p class="warning">Quantity difference will be recorded automatically</p>'}<div class="actions"><button class="secondary" onclick="found()">Back</button><button class="primary" onclick="verify()">Start pallet 1</button></div></div>`)}function verify(){step=3;shell('Pallet 1 of '+count,`<p class="muted">NODARA asks only for required physical verification.</p><div class="card"><div class="summary"><div class="mini"><span>Detected</span><b>5 CTN</b></div><div class="mini"><span>Contained</span><b>60 EA</b></div><div class="mini"><span>Weight</span><b>742 lb</b></div></div><div class="record">48 × 40 × 62 IN<br>ABC-123 · 5 CTN × 12 EA</div><div class="status"><span>Photos</span><b class="ok">4 / 4 captured</b></div><div class="status"><span>Dimensions</span><b class="ok">Captured</b></div><div class="status"><span>Condition</span><b>${damaged?'<span class="warning">Damaged</span>':'Good'}</b></div><div class="actions"><button class="secondary" onclick="damage()">${damaged?'Edit damage':'Report damage'}</button><button class="primary" onclick="finish()">${damaged?'Continue with exception':'Looks good'}</button></div></div>`)}function damage(){damaged=true;shell('Document the exception.',`<p class="muted">Only exception details appear because damage was reported.</p><div class="card"><div class="record"><strong>Carton 2</strong><br>Crushed corner<br><span class="ok">3 evidence photos captured</span></div><button class="secondary" style="width:100%;margin-top:12px">Add photo</button><div class="actions"><button class="secondary" onclick="damaged=false;verify()">Cancel</button><button class="primary" onclick="verify()">Save exception</button></div></div>`)}function finish(){step=4;shell('Receipt complete.',`<p class="ok">WR-260901-0042 · custody received</p><div class="card"><div class="record"><strong>ACME Logistics</strong><br>${count} PLT · ${count*5} CTN · ${count*60} EA<div class="chips"><span class="chip">Inventory created</span><span class="chip">Labels ready</span>${damaged?'<span class="chip">Damage exception</span>':''}</div></div><div class="status"><span>Next</span><b>Putaway</b></div><button class="primary" style="width:100%;margin-top:16px">Print labels</button><button class="secondary" style="width:100%;margin-top:10px">Start guided putaway</button><button class="subtle" style="width:100%" onclick="home()">Done</button></div>`)}home();</script></body></html>
