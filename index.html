<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NODARA</title><style>:root{--bg:#07090d;--panel:#0f131a;--line:#202735;--text:#f6f8fb;--muted:#858e9e;--blue:#3b82f6;--blue2:#60a5fa;--good:#5bd3a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#0c2345 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{border-right:1px solid var(--line);padding:26px 18px}.brand{font-weight:800;letter-spacing:.18em;margin:0 10px 38px}.brand i,.eyebrow{color:var(--blue2)}.nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:12px 14px;text-align:left;border-radius:12px;font-size:14px;margin:2px 0}.nav button:first-child{background:#121824;color:#fff}.main{padding:36px 44px 100px;max-width:1150px;width:100%;margin:auto}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.title{font-size:42px;letter-spacing:-.045em;margin:8px 0}.muted{color:var(--muted)}.primary,.secondary,.option{border-radius:13px;padding:15px 17px;font-size:14px;color:#fff}.primary{background:linear-gradient(135deg,var(--blue),#2563eb);border:1px solid #5a97f7;font-weight:700}.secondary,.option{background:#131923;border:1px solid #273142}.card{background:linear-gradient(180deg,#111720,#0c1016);border:1px solid var(--line);border-radius:19px;padding:22px;margin-top:24px}.top{display:flex;justify-content:space-between;align-items:start}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{margin-top:14px}.field label{display:block;color:#9ba5b5;font-size:12px;margin-bottom:7px}.field input{width:100%;background:#0b1017;border:1px solid #293345;color:#fff;border-radius:12px;padding:14px;font-size:15px}.options{display:grid;gap:10px;margin-top:24px}.option{text-align:left;display:flex;gap:14px;align-items:center}.option strong{display:block}.option small{display:block;color:var(--muted);margin-top:4px}.option.selected{border-color:#4f8ff5;background:#12213a}.dot{width:17px;height:17px;border:2px solid #657188;border-radius:50%}.selected .dot{border:5px solid var(--blue2)}.steps{display:flex;gap:7px;margin:25px 0}.steps span{height:3px;flex:1;background:#242c39;border-radius:4px}.steps span.on{background:var(--blue)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#131923;padding:15px;border-radius:13px}.mini b{display:block;font-size:24px}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1}.tree{padding:14px;background:#0b1017;border:1px solid #222b39;border-radius:13px;margin-top:15px;line-height:1.9}.done{color:var(--good)}@media(max-width:760px){.app{display:block}.side{display:none}.main{padding:26px 18px 90px}.title{font-size:34px}.row,.summary{grid-template-columns:1fr}.top{align-items:center}}</style></head><body><div class="app"><aside class="side"><div class="brand">NODARA<i>°</i></div><nav class="nav"><button onclick="home()">Command</button><button>Jobs</button><button>Warehouse</button><button>Inventory</button><button>Move</button><button>Pricing</button><button>Finance</button><button>Entities</button></nav></aside><main class="main" id="main"></main></div><script>
let step=0,depth='units';const M=document.getElementById('main');const labels=['Identify','Tracking','Cargo','Measure','Review','Complete'];function progress(){return `<div class="steps">${labels.map((_,i)=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div>`}function home(){step=0;M.innerHTML=`<div class="top"><div><div class="eyebrow">Command</div><h1 class="title">Good morning.</h1><div class="muted">Here’s what needs attention.</div></div><button class="primary" onclick="receive()">＋ Receive</button></div><div class="card"><div class="eyebrow">Next best action</div><h2>Receive expected cargo</h2><p class="muted">Start a guided receipt. NODARA adapts to the service and inventory depth.</p><button class="primary" onclick="receive()">Start receiving</button></div>`}function shell(title,body){M.innerHTML=`<div class="eyebrow">Warehouse · Receive</div>${progress()}<h1 class="title">${title}</h1>${body}`}
function receive(){step=0;shell('Identify the cargo.',`<p class="muted">Scan first. Search or manual entry only when needed.</p><div class="card"><button class="primary" style="width:100%" onclick="tracking()">Scan barcode / QR</button><button class="secondary" style="width:100%;margin-top:10px" onclick="tracking()">Scan document with OCR</button><div class="field"><label>Customer / PO / reference</label><input placeholder="ACME · PO 58492"></div><button class="secondary" style="width:100%;margin-top:10px" onclick="tracking()">Continue manually</button></div>`)}
function tracking(){step=1;shell('How should we track it?',`<p class="muted">Choose the deepest inventory level required for this service.</p><div class="options">${[['handling','Handling unit only','Pallet, crate or loose piece.'],['packages','Packages','Track pallet and cartons.'],['units','Units / SKU','Track packages and contained quantities.'],['serialized','Serialized','Control each unit by serial number.']].map(x=>`<button class="option ${depth===x[0]?'selected':''}" onclick="depth='${x[0]}';tracking()"><span class="dot"></span><span><strong>${x[1]}</strong><small>${x[2]}</small></span></button>`).join('')}</div><div class="actions"><button class="secondary" onclick="receive()">Back</button><button class="primary" onclick="cargo()">Continue</button></div>`)}
function cargo(){step=2;shell('Describe what arrived.',`<p class="muted">Capture the structure once. NODARA expands the hierarchy.</p><div class="card"><div class="row"><div class="field"><label>Pallets</label><input id="p" value="1" type="number"></div><div class="field"><label>Boxes per pallet</label><input id="b" value="5" type="number"></div><div class="field"><label>Units per box</label><input id="u" value="12" type="number"></div><div class="field"><label>Part / SKU</label><input id="sku" value="ABC-123"></div></div><div class="tree">PALLET 1<br>↳ 5 BOXES<br>&nbsp;&nbsp;↳ 12 EA each · ABC-123<br><b>60 total units</b></div><div class="actions"><button class="secondary" onclick="tracking()">Back</button><button class="primary" onclick="measure()">Continue</button></div></div>`)}
function measure(){step=3;shell('Verify the cargo.',`<p class="muted">Measure and inspect only what the service requires.</p><div class="card"><div class="row"><div class="field"><label>Length (in)</label><input value="48"></div><div class="field"><label>Width (in)</label><input value="40"></div><div class="field"><label>Height (in)</label><input value="62"></div><div class="field"><label>Weight (lb)</label><input value="742"></div></div><div class="field"><label>Condition</label><input value="Good — no visible damage"></div><button class="secondary" style="width:100%;margin-top:12px">Add photos</button><div class="actions"><button class="secondary" onclick="cargo()">Back</button><button class="primary" onclick="review()">Review</button></div></div>`)}
function review(){step=4;shell('Ready to receive.',`<p class="muted">One confirmation creates the WR, cargo hierarchy, UINs and inventory movements.</p><div class="card"><div class="summary"><div class="mini"><span class="muted">Pallets</span><b>1</b></div><div class="mini"><span class="muted">Boxes</span><b>5</b></div><div class="mini"><span class="muted">Units</span><b>60</b></div></div><div class="tree">1 PALLET → 5 BOXES → 60 EA<br>Part ABC-123 · 48 × 40 × 62 IN · 742 LB<br>Condition: Good</div><div class="actions"><button class="secondary" onclick="measure()">Back</button><button class="primary" onclick="complete()">Confirm receipt</button></div></div>`)}
function complete(){step=5;shell('Receipt complete.',`<p class="done">WR-260901-0042 created successfully</p><div class="card"><div class="summary"><div class="mini"><span class="muted">UINs</span><b>6</b></div><div class="mini"><span class="muted">Labels</span><b>6</b></div><div class="mini"><span class="muted">Next</span><b style="font-size:18px">Putaway</b></div></div><div class="tree">PLT-26-000184<br>↳ CTN-26-000921 … CTN-26-000925<br>Inventory: 60 EA · ABC-123</div><button class="primary" style="width:100%;margin-top:18px">Print labels</button><button class="secondary" style="width:100%;margin-top:10px">Scan putaway location</button><button class="secondary" style="width:100%;margin-top:10px" onclick="home()">Done</button></div>`)}home();</script></body></html>
