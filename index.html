<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NODARA</title><style>:root{--bg:#07090d;--panel:#0f131a;--line:#202735;--text:#f6f8fb;--muted:#8791a1;--blue:#3b82f6;--blue2:#60a5fa;--good:#62d7a7;--warn:#f2b45b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% 0,#0d2448 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid var(--line);padding:27px 17px;background:#080b10aa}.brand{font-weight:800;letter-spacing:.18em;margin:0 10px 38px}.brand i,.eyebrow{color:var(--blue2)}.nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:12px 14px;text-align:left;border-radius:12px;font-size:14px;margin:2px 0}.nav button:first-child{background:#121824;color:#fff}.main{padding:38px 44px 100px;max-width:950px;width:100%;margin:auto}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.15em;text-transform:uppercase}.title{font-size:46px;letter-spacing:-.05em;margin:9px 0 8px}.muted{color:var(--muted)}.primary,.secondary,.choice{border-radius:14px;padding:16px 18px;font-size:15px;color:#fff;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),#2563eb);border:1px solid #609bfa;font-weight:750;box-shadow:0 14px 38px #2563eb22}.secondary,.choice{background:#131923;border:1px solid #273142}.card{background:linear-gradient(180deg,#111720,#0c1016);border:1px solid var(--line);border-radius:21px;padding:24px;margin-top:26px;box-shadow:0 20px 60px #0005}.top{display:flex;justify-content:space-between;align-items:start}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1}.steps{display:flex;gap:7px;margin:25px 0}.steps span{height:3px;flex:1;background:#242c39;border-radius:4px}.steps span.on{background:var(--blue)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#131923;padding:15px;border-radius:14px}.mini span{display:block;color:var(--muted);font-size:12px}.mini b{display:block;font-size:24px;margin-top:4px}.record{padding:18px;background:#0b1017;border:1px solid #222b39;border-radius:15px;margin-top:16px;line-height:1.7}.record strong{font-size:18px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{font-size:12px;padding:7px 9px;border-radius:999px;background:#151b25;border:1px solid #2b3545}.chip.warn{border-color:#6c4d20;color:#ffd28b}.choice{width:100%;margin-top:10px;text-align:left}.choice strong{display:block}.choice small{display:block;color:var(--muted);margin-top:4px}.choice.selected{border-color:#4f8ff5;background:#12213a}.status{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #1f2733}.status:last-child{border-bottom:0}.ok{color:var(--good)}.warning{color:var(--warn)}.field{margin-top:13px}.field label{display:block;color:#9ba5b5;font-size:12px;margin-bottom:7px}.field input{width:100%;background:#0b1017;border:1px solid #293345;color:#fff;border-radius:12px;padding:14px;font-size:15px}.hidden{display:none}.scanbox{padding:28px;border:1px dashed #33415a;border-radius:18px;text-align:center;background:#0c1118}.scanmark{width:52px;height:52px;border:2px solid var(--blue2);border-radius:14px;margin:0 auto 14px;position:relative}.scanmark:before,.scanmark:after{content:"";position:absolute;background:var(--blue2)}.scanmark:before{width:22px;height:2px;left:13px;top:24px}.scanmark:after{width:2px;height:22px;left:24px;top:13px}.big{font-size:30px;font-weight:780;letter-spacing:-.04em}.counter{display:flex;align-items:center;justify-content:center;gap:20px;margin:22px 0}.counter button{width:48px;height:48px;border-radius:50%;background:#151c27;border:1px solid #2b3648;color:#fff;font-size:24px}.counter b{font-size:44px}.sop{border-left:3px solid var(--blue);padding-left:16px;margin-top:18px}.sop div{margin:7px 0}.danger{border-left-color:var(--warn)}@media(max-width:760px){.app{display:block}.side{display:none}.main{padding:27px 18px 90px}.title{font-size:36px}.top{align-items:center}.summary{grid-template-columns:1fr}.actions{position:sticky;bottom:12px;background:#07090de8;padding-top:8px;backdrop-filter:blur(10px)}}</style></head><body><div class="app"><aside class="side"><div class="brand">NODARA<i>°</i></div><nav class="nav"><button onclick="home()">Command</button><button>Jobs</button><button>Warehouse</button><button>Inventory</button><button>Move</button><button>Pricing</button><button>Finance</button><button>Entities</button></nav></aside><main class="main" id="main"></main></div><script>
const M=document.getElementById('main');let step=0,count=5,damaged=false;const steps=['Identify','Confirm','Count','Receive','Verify','Done'];function progress(){return `<div class="steps">${steps.map((_,i)=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div>`}function shell(title,body){M.innerHTML=`<div class="eyebrow">Warehouse · Guided Receive</div>${progress()}<h1 class="title">${title}</h1>${body}`}function home(){step=0;M.innerHTML=`<div class="top"><div><div class="eyebrow">Command</div><h1 class="title">Good morning.</h1><div class="muted">NODARA handles the paperwork. You handle the cargo.</div></div><button class="primary" onclick="start()">Receive</button></div><div class="card"><div class="eyebrow">Next best action</div><h2>5 pallets expected from ABC Trucking</h2><p class="muted">ACME Logistics · PO 458291 · Storage</p><button class="primary" onclick="start()">Start receiving</button></div>`}
function start(){step=0;shell('What arrived?',`<p class="muted">Scan anything you have. NODARA will find the record.</p><div class="card"><div class="scanbox"><div class="scanmark"></div><div class="big">Scan label or document</div><p class="muted">QR, barcode, BOL, packing list, PO, PRO or tracking number</p><button class="primary" onclick="found()">Scan</button></div><button class="secondary" style="width:100%;margin-top:12px" onclick="found()">Search instead</button></div>`)}
function found(){step=1;shell('Found it.',`<p class="muted">NODARA matched the expected receipt and delivery information.</p><div class="card"><div class="record"><strong>ACME Logistics</strong><br>ABC Manufacturing → XYZ Imports<br>Automotive replacement parts<div class="chips"><span class="chip">PO 458291</span><span class="chip">BOL MIA392810</span><span class="chip">PRO 73829103</span><span class="chip">Storage</span></div></div><div class="record"><div class="status"><span>Expected</span><b>5 pallets</b></div><div class="status"><span>Carrier</span><b>ABC Trucking</b></div><div class="status"><span>Driver</span><b>John Smith</b></div><div class="status"><span>Time in</span><b>Recorded automatically</b></div></div><div class="actions"><button class="secondary" onclick="editFound()">Something changed</button><button class="primary" onclick="countStep()">Looks right</button></div></div>`)}
function editFound(){shell('What changed?',`<p class="muted">Only correct what is different.</p><div class="card"><div class="field"><label>Carrier</label><input value="ABC Trucking"></div><div class="field"><label>Driver</label><input value="John Smith"></div><div class="field"><label>PRO / tracking</label><input value="73829103"></div><div class="field"><label>Reference</label><input value="PO 458291"></div><div class="actions"><button class="secondary" onclick="found()">Cancel</button><button class="primary" onclick="countStep()">Save changes</button></div></div>`)}
function countStep(){step=2;shell('How many pallets are here?',`<p class="muted">Expected: 5 pallets</p><div class="card" style="text-align:center"><div class="counter"><button onclick="count=Math.max(0,count-1);countStep()">−</button><b>${count}</b><button onclick="count++;countStep()">+</button></div>${count===5?`<p class="ok">Matches expected quantity</p>`:`<p class="warning">Expected 5 · discrepancy will be recorded</p>`}<div class="actions"><button class="secondary" onclick="found()">Back</button><button class="primary" onclick="receiveRule()">Continue</button></div></div>`)}
function receiveRule(){step=3;shell('Receive by carton.',`<p class="muted">ACME · Storage profile applied automatically.</p><div class="card"><div class="sop"><div><b>Track:</b> cartons + contained units</div><div><b>Photos:</b> 4 required</div><div><b>Dimensions:</b> required per pallet</div><div><b>Labels:</b> pallet + carton UIN</div><div><b>Putaway:</b> required</div></div><div class="record"><strong>Pallet 1 of ${count}</strong><br>Detected: 5 cartons · 12 EA each · Part ABC-123<br><span class="muted">60 total units</span></div><button class="primary" style="width:100%;margin-top:14px" onclick="verify()">Verify pallet 1</button></div>`)}
function verify(){step=4;shell('Pallet 1 of '+count,`<p class="muted">Only verify the physical facts.</p><div class="card"><div class="summary"><div class="mini"><span>Cartons</span><b>5</b></div><div class="mini"><span>Units</span><b>60</b></div><div class="mini"><span>Weight</span><b>742 lb</b></div></div><div class="record">48 × 40 × 62 IN<br>Part ABC-123 · 5 CTN × 12 EA</div><div class="status"><span>Required photos</span><b class="ok">4 / 4</b></div><div class="status"><span>Dimensions</span><b class="ok">Captured</b></div><div class="status"><span>Condition</span><b>${damaged?'<span class="warning">Damaged</span>':'Good'}</b></div><div class="actions"><button class="secondary" onclick="damage()">${damaged?'Edit damage':'Report damage'}</button><button class="primary" onclick="finish()">${damaged?'Continue with exception':'Looks good'}</button></div></div>`)}
function damage(){damaged=true;shell('Document the damage.',`<p class="muted">NODARA will create the exception and preserve evidence automatically.</p><div class="card"><div class="sop danger"><div><b>Unit:</b> Pallet 1 · Carton 2</div><div><b>Type:</b> Crushed corner</div><div><b>Evidence:</b> 3 photos captured</div></div><button class="secondary" style="width:100%;margin-top:14px">Add another photo</button><div class="actions"><button class="secondary" onclick="damaged=false;verify()">Cancel</button><button class="primary" onclick="verify()">Save exception</button></div></div>`)}
function finish(){step=5;shell('Receipt complete.',`<p class="ok">WR-260901-0042 created successfully</p><div class="card"><div class="record"><strong>ACME Logistics</strong><br>5 PLT · 25 CTN · 300 EA<br>Custody: ABC Trucking → Warehouse<div class="chips"><span class="chip">WR-260901-0042</span><span class="chip">25 carton UINs</span>${damaged?'<span class="chip warn">Damage exception</span>':''}</div></div><div class="status"><span>Labels</span><b class="ok">Ready</b></div><div class="status"><span>Inventory</span><b class="ok">Created</b></div><div class="status"><span>Next action</span><b>Putaway</b></div><button class="primary" style="width:100%;margin-top:16px">Print labels</button><button class="secondary" style="width:100%;margin-top:10px">Start guided putaway</button><button class="secondary" style="width:100%;margin-top:10px" onclick="home()">Done</button></div>`)}home();</script></body></html>
